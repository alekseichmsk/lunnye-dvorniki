<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e07a45">
  <meta name="description" content="Марсианские дворники — мети ржавую пыль, относи её на корабль и запускай рейс.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дворники">
  <title>Марсианские дворники</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <h1 class="sr-only">Марсианские дворники</h1>
    <div class="hud-top">
      <div class="pill">
        <strong id="money">0</strong>
        <span id="mul" class="mul"></span>
        <span id="patches" class="patches" hidden></span>
        <span id="pack-label" class="sr-only">0 / 1K</span>
        <span class="mini-bar" aria-hidden="true"><span id="pack-bar"></span></span>
      </div>
      <button id="shop-open" type="button" class="icon-fab" aria-label="Магазин">⌂</button>
      <button id="menu-open" type="button" class="icon-fab" aria-label="Меню">☰</button>
    </div>
    <button id="launch" type="button" class="launch-fab" disabled>
      <img src="assets/icon-rocket.svg" width="16" height="16" alt="">
      <span id="launch-label">Запустить рейс</span>
    </button>

    <main id="stage">
      <canvas id="view" aria-label="Поверхность Марса"></canvas>
      <div id="toast" role="status"></div>
      <div id="banner" role="status"></div>
    </main>

    <div id="stick" class="stick" aria-hidden="true">
      <div id="knob" class="knob"></div>
    </div>
    <div id="menu" class="menu hidden">
      <p class="tagline">станция «Ржавый берег»</p>
      <div class="loc-row">
        <span id="sector-name">Ржавые равнины</span>
        <span id="price">пыль ×1</span>
        <span id="sector-pct">0%</span>
      </div>
      <div class="bar thick" aria-hidden="true"><div id="sector-bar"></div></div>
      <div id="strip" class="strip" aria-label="Края Марса"></div>
      <p id="hint" class="hint">Иди по ржавой пыли. Под ней проступит марсианский грунт.</p>
      <div class="action-row">
        <button id="place" type="button" class="ghost" hidden>Поставить</button>
        <button id="ride" type="button" class="ghost" hidden>Сесть</button>
        <button id="fullscreen" type="button" class="ghost" aria-pressed="false">На весь экран</button>
      </div>
    </div>
  </div>

  <div id="shop" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="shop-title">
    <div class="sheet-card">
      <div class="sheet-head">
        <div class="grab" id="shop-grab"></div>
        <h2 id="shop-title">Магазин</h2>
        <div class="qty" role="group" aria-label="Сколько купить">
          <button type="button" data-qty="1" class="on">×1</button>
          <button type="button" data-qty="10">×10</button>
          <button type="button" data-qty="max">макс</button>
        </div>
        <button id="shop-close" type="button" class="icon-btn" aria-label="Закрыть">×</button>
      </div>
      <p id="shop-summary" class="summary"></p>
      <div id="tabs" class="tabs"></div>
      <div id="shop-body" class="shop-body"></div>
      <div class="sheet-foot">
        <span class="keys">WASD или стрелки · E магазин · пробел рейс</span>
        <button id="reset" type="button" class="text-danger">Стереть сохранение</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
